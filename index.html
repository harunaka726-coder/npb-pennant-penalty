    function detectLang() {
      const list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "ja"];
      for (const tag of list) {
        const base = String(tag || "").toLowerCase().split("-")[0];
        if (base === "ja") return "ja";
        if (base === "en") return "en";
      }
      return "en";
    }

    function savedLang() {
      try {
        const value = localStorage.getItem(LANG_KEY);
        if (value === "ja" || value === "en") return value;
      } catch (err) { /* use the device language */ }
      return "";
    }

    let lang = savedLang() || detectLang();

    function setLang(next) {
      if (next !== "ja" && next !== "en" || next === lang) return;
      lang = next;
      localStorage.setItem(LANG_KEY, next);
      const link = document.querySelector("[data-privacy]");
      if (link) link.href = privacyUrl();
      if (app.public) paint();
      else applyChrome();
    }

    function t(key, vars) {
      const table = STR[lang] || STR.en;
      let text = table[key] || STR.en[key] || STR.ja[key] || key;
      if (vars) {
        Object.keys(vars).forEach((name) => {
          text = text.replaceAll(`{${name}}`, vars[name]);
        });
      }
      return text;
    }

    function applyChrome() {
      document.documentElement.lang = lang === "ja" ? "ja" : "en";
      document.title = t("appTitle");
      const brand = document.querySelector(".brand");
      if (brand) brand.textContent = t("appTitle");
      document.querySelectorAll("nav a").forEach((link) => {
        const key = link.dataset.route;
        if (key) link.textContent = t(key === "graph" ? "graph" : key === "settings" ? "settings" : "home");
      });
      const adLabel = document.querySelector(".ad-label");
      if (adLabel) adLabel.textContent = t("ad");
      const slot = document.getElementById("ad-banner");
      if (slot) slot.setAttribute("aria-label", t("ad"));
    }

    function privacyUrl() {
      return `https://harunaka726-coder.github.io/npb-pennant-penalty/privacy.html?lang=${lang}`;
    }

    function mountAd() {
      const slot = document.getElementById("ad-banner");
      if (!slot || slot.dataset.mounted) return;
      slot.dataset.mounted = "1";
      slot.dataset.admobApp = ADMOB.appId;
      slot.dataset.admobUnit = ADMOB.bannerId;
      const native = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform();
      const plugin = native && window.Capacitor.Plugins && window.Capacitor.Plugins.AdMob;
      if (plugin) {
        plugin.initialize({ appId: ADMOB.appId, initializeForTesting: false }).then(() => plugin.showBanner({
          adId: ADMOB.bannerId,
          adSize: "BANNER",
          position: "BOTTOM_CENTER",
          margin: 0
        })).catch(() => {});
        return;
      }
      const client = ADMOB.bannerId.split("/")[0];
      const unit = ADMOB.bannerId.split("/")[1];
      const ins = document.createElement("ins");
      ins.className = "adsbygoogle";
      ins.style.display = "inline-block";
      ins.style.width = "320px";
      ins.style.height = "50px";
      ins.setAttribute("data-ad-client", client);
      ins.setAttribute("data-ad-slot", unit);
      slot.appendChild(ins);
      const script = document.createElement("script");
      script.async = true;
      script.crossOrigin = "anonymous";
      script.src = `https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=${encodeURIComponent(client)}`;
      script.onload = () => {
        try { (window.adsbygoogle = window.adsbygoogle || []).push({}); }
        catch (err) { /* Google fills this slot when the unit is ready */ }
      };
      document.head.appendChild(script);
    }

    function defaultUser() {
      return {
        draft: { central: DEFAULT_DRAFT.central.slice(), pacific: DEFAULT_DRAFT.pacific.slice() },
        confirmed: null,
        locked: false,
        history: [],
        archives: [],
        season_year: null,
        view_year: null
      };
    }

    function validLineup(ids, league) {
      const expected = new Set(league === "central" ? CENTRAL_IDS : PACIFIC_IDS);
      return Array.isArray(ids) && ids.length === 6 && new Set(ids).size === 6 && ids.every((id) => expected.has(id));
    }

    function repairUser(raw) {
      const user = defaultUser();
      const source = raw && typeof raw === "object" ? raw : {};
      ["central", "pacific"].forEach((league) => {
        if (validLineup(source.draft && source.draft[league], league)) user.draft[league] = source.draft[league].slice();
      });
      const confirmed = source.confirmed;
      if (confirmed && validLineup(confirmed.central, "central") && validLineup(confirmed.pacific, "pacific")) {
        user.confirmed = {
          central: confirmed.central.slice(),
          pacific: confirmed.pacific.slice(),
          confirmed_at: confirmed.confirmed_at || "",
          confirmed_label: confirmed.confirmed_label || confirmed.updated_label || "",
          updated_at: confirmed.updated_at || confirmed.confirmed_at || "",
          updated_label: confirmed.updated_label || confirmed.confirmed_label || ""
        };
      }
      user.locked = Boolean(source.locked && user.confirmed);
      user.history = Array.isArray(source.history) ? source.history : [];
      user.archives = Array.isArray(source.archives) ? source.archives.filter((item) => item && item.year) : [];
      user.season_year = Number.isInteger(source.season_year) ? source.season_year : null;
      user.view_year = Number.isInteger(source.view_year) ? source.view_year : null;
      if (user.view_year && !user.archives.some((item) => item.year === user.view_year)) user.view_year = null;
      return user;
    }

    function loadUser() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return repairUser(JSON.parse(raw));
      } catch (err) { /* keep the default */ }
      return null;
    }

    function saveUser(user) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(user));
      app.user = user;
    }

    function migrateLegacy(data) {
      if (!data || !data.legacy_user || localStorage.getItem(STORAGE_KEY)) return false;
      saveUser(repairUser(data.legacy_user));
      return true;
    }

    function nowLabel() {
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Tokyo", year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit", hourCycle: "h23"
      }).formatToParts(new Date());
      const get = (type) => parts.find((part) => part.type === type).value;
      return `${get("year")}/${get("month")}/${get("day")} ${get("hour")}:${get("minute")}`;
    }

    function sameOrder(confirmed, lineup) {
      return confirmed.central.join() === lineup.central.join() && confirmed.pacific.join() === lineup.pacific.join();
    }

    function rankRows(prediction, actual) {
      const actualRank = {};
      actual.forEach((id, index) => { actualRank[id] = index + 1; });
      return prediction.map((team, index) => {
        const predicted = index + 1;
        const current = actualRank[team];
        const delta = current - predicted;
        const info = teamById(team);
        return {
          team, predicted_rank: predicted, actual_rank: current, delta, penalty: Math.abs(delta),
          name: displayName(info), full_name: info.full_name, colors: info.colors
        };
      });
    }

    function scoreBundle(prediction, standings, snapshots, provisional) {
      const ready = standings && validLineup(standings.central, "central") && validLineup(standings.pacific, "pacific")
        && prediction && validLineup(prediction.central, "central") && validLineup(prediction.pacific, "pacific");
      if (!ready) return { score: null, trend: [], ranks: null };
      const blocks = {};
      let total = 0;
      ["central", "pacific"].forEach((league) => {
        const rows = rankRows(prediction[league], standings[league]);
        const leagueTotal = rows.reduce((sum, row) => sum + row.penalty, 0);
        total += leagueTotal;
        blocks[league] = { name: t(league), total: leagueTotal, rows };
      });
      const score = { total, central: blocks.central, pacific: blocks.pacific, provisional: Boolean(provisional) };
      const trend = [];
      (snapshots || []).forEach((snap) => {
        if (!validLineup(snap.central, "central") || !validLineup(snap.pacific, "pacific")) return;
        const central = rankRows(prediction.central, snap.central).reduce((sum, row) => sum + row.penalty, 0);
        const pacific = rankRows(prediction.pacific, snap.pacific).reduce((sum, row) => sum + row.penalty, 0);
        trend.push({ date: snap.date, central, pacific, total: central + pacific });
      });
      const ranks = {};
      ["central", "pacific"].forEach((league) => {
        const dates = [];
        const series = {};
        prediction[league].forEach((id) => { series[id] = []; });
        (snapshots || []).forEach((snap) => {
          if (!validLineup(snap[league], league)) return;
          dates.push(snap.date);
          const place = {};
          snap[league].forEach((id, index) => { place[id] = index + 1; });
          prediction[league].forEach((id) => series[id].push(place[id]));
        });
        ranks[league] = {
          dates,
          teams: prediction[league].map((id, index) => {
            const info = teamById(id);
            return { id, name: displayName(info), colors: info.colors, predicted_rank: index + 1, ranks: series[id] };
          })
        };
      });
      return { score, trend, ranks };
    }

    function activePrediction(user) {
      if (user.confirmed) return { central: user.confirmed.central.slice(), pacific: user.confirmed.pacific.slice() };
      return { central: user.draft.central.slice(), pacific: user.draft.pacific.slice() };
    }

    function compose() {
      const pub = app.public || {};
      const user = app.user || defaultUser();
      const standings = pub.standings || null;
      const prediction = activePrediction(user);
      const using = user.confirmed ? "confirmed" : "draft";
      const live = scoreBundle(prediction, standings, pub.snapshots || [], using === "draft");
      const archive = (user.archives || []).find((item) => item.year === user.view_year) || null;
      let archiveView = null;
      if (archive) {
        const archived = scoreBundle(archive.prediction, archive.standings, archive.snapshots || [], false);
        archiveView = {
          year: archive.year,
          score: archived.score,
          trend: archived.trend,
          ranks: archived.ranks,
          standings: archive.standings,
          progress: archive.progress,
          recent_games: archive.recent_games || [],
          games_url: archive.games_url || pub.games_url
        };
      }
      const ready = standings && validLineup(standings.central, "central") && validLineup(standings.pacific, "pacific");
      const seasonYear = standings && standings.season;
      const canStart = Boolean(ready && standings.season_finished && !(user.season_year && seasonYear && user.season_year !== seasonYear));
      return {
        teams: pub.teams || [],
        draft: user.draft,
        confirmed: user.confirmed,
        confirmed_label: user.confirmed ? user.confirmed.updated_label : null,
        first_confirmed_label: user.confirmed ? user.confirmed.confirmed_label : null,
        locked: user.locked,
        history: (user.history || []).slice().reverse().slice(0, 30),
        standings,
        using,
        score: live.score,
        trend: live.trend,
        ranks: live.ranks,
        draft_differs: Boolean(user.confirmed && !sameOrder(user.confirmed, user.draft)),
        stale: pub.stale,
        last_error: pub.last_error,
        snapshot_count: (pub.snapshots || []).length,
        season_year: user.season_year || seasonYear || null,
        viewing_year: archive ? archive.year : null,
        can_start_next: canStart,
        next_year: canStart ? Number(seasonYear) + 1 : null,
        archives: (user.archives || []).map((item) => ({ year: item.year, label: item.archived_label })),
        progress: pub.progress,
        recent_games: pub.recent_games || [],
        games_url: pub.games_url,
        archive_view: archiveView,
        snapshots: pub.snapshots || []
      };
    }

    function displayName(team) {
      if (!team) return "";
      if (lang === "en" && TEAM_EN[team.id]) return TEAM_EN[team.id];
      return team.name || team.id;
    }

    function sideName(game, side) {
      const id = game[side === "away" ? "away_id" : "home_id"];
      if (id) return displayName(teamById(id));
      return side === "away" ? game.away : game.home;
    }

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }

    function enqueue(fn) {
      chain = chain.then(fn, fn);
      return chain;
    }

    function toast(message) {
      const el = document.getElementById("toast");
      el.textContent = message;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 2800);
    }

    async function postJson(url, body) {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body || {})
      });
      const data = await res.json();
      if (!res.ok) toast(data.error || t("saveFail"));
      return data;
    }

    function paint(key, vars) {
      app.state = compose();
      render(window.scrollY);
      if (key) toast(t(key, vars));
    }

    function applyState(data) {
      if (data && data.teams) app.public = data;
      migrateLegacy(data);
      app.user = loadUser() || defaultUser();
      if (!localStorage.getItem(STORAGE_KEY)) saveUser(app.user);
      const y = window.scrollY;
      app.state = compose();
      render(y);
      if (data && data.notice_code === "standingsNotYet") toast(t("standingsNotYet", { year: (app.user && app.user.season_year) || "" }));
      else if (data && data.notice && data.notice_code !== "standingsNotYet") toast(data.notice);
    }

    function teamById(id) {
      const catalog = (app.public && app.public.teams) || (app.state && app.state.teams) || [];
      return catalog.find((team) => team.id === id) || { id, name: id, full_name: id, colors: ["#ccc", "#111"], stroke: "#555" };
    }

    function arrow(delta) {
      if (delta > 0) return `↓${delta}`;
      if (delta < 0) return `↑${Math.abs(delta)}`;
      return "→";
    }

    function deltaClass(delta) {
      if (delta > 0) return "is-down";
      if (delta < 0) return "is-up";
      return "is-flat";
    }

    function swatch(colors) {
      return `<span class="swatch" style="--c1:${colors[0]};--c2:${colors[1]}"></span>`;
    }

    function club(row, rank, withName) {
      const name = withName ? `<span class="name" title="${esc(row.full_name)}">${esc(displayName(row))}</span>` : "";
      return `<div class="club"><span class="rank">${rank}</span>${swatch(row.colors)}${name}</div>`;
    }

    function shortDate(iso) {
      const parts = String(iso).split("-");
      if (parts.length !== 3) return iso;
      return `${Number(parts[1])}/${Number(parts[2])}`;
    }

    function strokeFor(row) {
      const id = row.team || row.id;
      const team = id ? teamById(id) : null;
      if (team && team.stroke) return team.stroke;
      const colors = row.colors || (team && team.colors) || ["#1e3a5f"];
      return colors[0];
    }

    function localTotal(prediction, actual) {
      const rank = {};
      actual.forEach((id, index) => { rank[id] = index + 1; });
      return prediction.reduce((sum, id, index) => sum + Math.abs(index + 1 - rank[id]), 0);
    }

    function preview() {
      const standings = app.state.standings;
      if (!standings || !standings.central || !standings.pacific) return null;
      const central = localTotal(app.state.draft.central, standings.central);
      const pacific = localTotal(app.state.draft.pacific, standings.pacific);
      return { central, pacific, total: central + pacific };
    }

    function display() {
      const archive = app.state && app.state.archive_view;
      return archive || app.state || {};
    }

    function jpDate(iso) {
      const parts = String(iso || "").split("-");
      if (parts.length !== 3) return "";
      if (lang !== "ja") return `${Number(parts[1])}/${Number(parts[2])}`;
      return `${Number(parts[1])}月${Number(parts[2])}日`;
    }

    function missLabel(value) {
      return lang === "ja" ? `${value}ズレ` : String(value);
    }

    function actionLabel(action) {
      if (action === "confirm" || action === "確定") return t("actionConfirm");
      if (action === "update" || action === "更新") return t("actionUpdate");
      return action;
    }

    function todayJst() {
      return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Tokyo", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
    }

    function shareText(full) {
      const score = display().score;
      if (!score) return t("shareFallback");
      const mark = score.provisional ? (lang === "ja" ? "（未確定）" : "(draft) ") : "";
      const head = t("shareHead", { mark, total: score.total, c: score.central.total, p: score.pacific.total });
      const compactLine = (block) => block.rows.map((row) => `${row.name}${row.predicted_rank}→${row.actual_rank}`).join(" ");
      if (!full) {
        const cl = lang === "ja" ? "セ" : "CL";
        const pl = lang === "ja" ? "パ" : "PL";
        const tag = lang === "ja" ? "\n0ズレがドンピシャ #プロ野球" : "\n0 is exact";
        return `${head}\n${cl} ${compactLine(score.central)}\n${pl} ${compactLine(score.pacific)}${tag}`;
      }
      const place = lang === "ja" ? "位" : "";
      const detail = (block) => block.rows.map((row) => `${row.predicted_rank}${place} ${row.name} → ${row.actual_rank}${place} (${arrow(row.delta)})  ${missLabel(row.penalty)}`).join("\n");
      const stamp = app.state.confirmed_label ? t("shareStamp", { label: app.state.confirmed_label }) : t("shareDraft");
      const perfect = lang === "ja" ? "0ズレがドンピシャ" : "0 is exact";
      return `${head}\n\n【${score.central.name}】\n${detail(score.central)}\n${t("leagueTotal", { name: score.central.name, total: score.central.total })}\n\n【${score.pacific.name}】\n${detail(score.pacific)}\n${t("leagueTotal", { name: score.pacific.name, total: score.pacific.total })}\n\n${stamp}\n${perfect}`;
    }

    function statusBanners() {
      const state = app.state;
      const parts = [];
      if (state.last_error) parts.push(`<p class="banner warn">${esc(state.last_error)}</p>`);
      if (state.using === "draft") {
        parts.push(`<p class="banner info">${esc(t("draftBanner"))}</p>`);
      } else if (!state.locked && state.draft_differs) {
        parts.push(`<p class="banner info">${esc(t("editBanner"))}</p>`);
      }
      return parts.join("");
    }

    function sourceLine() {
      const standings = display().standings;
      if (!standings || !standings.source_label) return "";
      const when = standings.fetched_label ? t("fetched", { label: standings.fetched_label }) : "";
      const link = standings.source_url
        ? `<a href="${esc(standings.source_url)}" target="_blank" rel="noopener">${esc(standings.source_label)}</a>`
        : esc(standings.source_label);
      const cross = standings.cross_check ? t("cross", { detail: standings.cross_check.detail || "" }) : "";
      return `<p class="source">${link}${when ? ` / ${esc(when)}` : ""}${cross}</p>`;
    }

    function seasonStatus(progress) {
      const start = app.state.can_start_next && !app.state.viewing_year
        ? `<button type="button" class="btn" data-action="start-season">${esc(t("startBtn", { year: app.state.next_year }))}</button>`
        : "";
      if (progress && progress.finished && progress.year) {
        return `<section class="season-status${start ? " has-action" : ""}"><p>${esc(t("finished", { year: progress.year }))}</p>${start}</section>`;
      }
      if (progress && progress.played != null && progress.total) {
        const when = progress.as_of ? (lang === "ja" ? `${jpDate(progress.as_of)}時点　` : `As of ${jpDate(progress.as_of)} · `) : "";
        const pct = Math.max(0, Math.min(100, Math.round(progress.played / progress.total * 100)));
        const head = t("progress", { when, total: progress.total, played: progress.played, remaining: progress.remaining });
        return `<section class="season-status"><p>${esc(head)}</p><div class="progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-valuetext="${pct}%"><span style="width:${pct}%"></span></div></section>`;
      }
      if (app.state.season_year && !app.state.standings && !app.state.viewing_year) {
        return `<section class="season-status"><p>${esc(t("preparing", { year: app.state.season_year }))}</p><p class="note">${esc(t("preparingNote"))}</p></section>`;
      }
      return "";
    }

    function viewingBanner() {
      if (!app.state.viewing_year) return "";
      const back = app.state.season_year || "";
      return `<div class="banner info">${esc(t("viewingBanner", { year: app.state.viewing_year }))}<button type="button" class="btn" data-action="view-season" data-year="">${esc(t("backTo", { year: back }))}</button></div>`;
    }

    function resultsCard(progress, games, url) {
      const list = games || [];
      if (!list.length && !url) return "";
      const finished = progress && progress.finished;
      const today = progress && progress.as_of && progress.as_of === todayJst();
      const title = finished ? t("finalDay") : (today ? t("todayGames") : t("recentGames"));
      const when = progress && progress.as_of ? jpDate(progress.as_of) : "";
      const rows = list.map((game) => `<li><span class="side away">${esc(sideName(game, "away"))}</span><span class="score">${esc(game.away_score)}</span><span class="hyphen">-</span><span class="score">${esc(game.home_score)}</span><span class="side">${esc(sideName(game, "home"))}</span></li>`).join("");
      const note = finished ? t("postseason") : t("gameDetail");
      const link = url ? `<p class="note">${esc(note)} <a href="${esc(url)}" target="_blank" rel="noopener">${esc(t("npbGames"))}</a></p>` : "";
      const body = rows ? `<ul class="results">${rows}</ul>` : `<p class="empty">${esc(t("noGames"))}</p>`;
      return `<article class="card"><div class="card-head"><h2>${title}</h2>${when ? `<span class="note">${esc(when)}</span>` : ""}</div>${body}${link}</article>`;
    }

    function attemptLog() {
      const attempts = display().standings && display().standings.attempts;
      if (!attempts || !attempts.length) return "";
      const items = attempts.map((item) => {
        const mark = item.ok ? `<span class="ok">${esc(t("ok"))}</span>` : `<span class="ng">${esc(t("ng"))}</span>`;
        const detail = item.detail ? `（${esc(item.detail)}）` : "";
        const error = item.error ? ` — ${esc(item.error)}` : "";
        return `<li>${mark} ${esc(item.label)} <span class="url">${esc(item.url)}</span>${detail}${error}</li>`;
      }).join("");
      return `<details class="log"><summary>${esc(t("log"))}</summary><ul>${items}</ul></details>`;
    }

    function hero() {
      const score = display().score;
      const total = score ? score.total : "—";
      const closeness = !score ? t("waitStandings") : (score.total === 0 ? t("perfect") : "");
      const unit = lang === "ja" ? `<small>${esc(t("miss"))}</small>` : "";
      const central = score ? `${score.central.total}${unit}` : "—";
      const pacific = score ? `${score.pacific.total}${unit}` : "—";
      const basis = app.state.viewing_year
        ? t("viewingYear", { year: app.state.viewing_year })
        : app.state.using === "confirmed"
          ? t("basisConfirmed", { label: app.state.confirmed_label || "" })
          : t("basisDraft");
      const shareDisabled = score ? "" : "disabled";
      const totalUnit = lang === "ja" ? `<span>${esc(t("miss"))}</span>` : "";
      return `
        <section class="card hero">
          <div class="hero-grid">
            <div>
              <p class="eyebrow">${esc(t("both"))}</p>
              <p class="score-num">${total}${totalUnit}</p>
              ${closeness ? `<p class="closeness">${esc(closeness)}</p>` : ""}
            </div>
            <div class="splits">
              <div><span>${esc(t("central"))}</span><strong>${central}</strong></div>
              <div><span>${esc(t("pacific"))}</span><strong>${pacific}</strong></div>
            </div>
            <div class="hero-actions">
              <button type="button" class="btn btn-primary" data-action="refresh">${esc(t("refresh"))}</button>
              <button type="button" class="btn" data-action="share" ${shareDisabled}>${esc(t("share"))}</button>
              <button type="button" class="btn" data-action="copy" ${shareDisabled}>${esc(t("copy"))}</button>
            </div>
          </div>
          <p class="score-basis">${esc(basis)}</p>
        </section>`;
    }

    function matchRow(row, rank, side) {
      const penalty = side === "actual"
        ? `<span class="penalty ${row.penalty === 0 ? "is-zero" : "is-miss"}">${row.penalty}${lang === "ja" ? `<span>${esc(t("miss"))}</span>` : ""}</span>`
        : "";
      const label = side === "pred"
        ? t("predAria", { p: row.predicted_rank, name: row.name, a: row.actual_rank, pen: row.penalty })
        : t("actAria", { a: rank, name: row.name, pen: row.penalty });
      return `<div class="match-row" data-team="${esc(row.team)}" data-stroke="${strokeFor(row)}" aria-label="${esc(label)}">${club(row, rank, side === "actual")}${penalty}</div>`;
    }

    function tableHtml(block, league) {
      const actual = block.rows.slice().sort((a, b) => a.actual_rank - b.actual_rank);
      const left = block.rows.map((row) => matchRow(row, row.predicted_rank, "pred")).join("");
      const right = actual.map((row) => matchRow(row, row.actual_rank, "actual")).join("");
      return `
        <article class="card league-${league}">
          <div class="card-head"><h2>${esc(block.name)}</h2></div>
          <div class="table-wrap">
            <div class="match-board">
              <div class="match-side">
                <div class="match-label">${esc(t("pred"))}</div>
                <div class="match-col pred">${left}</div>
              </div>
              <div class="match-bridge" aria-hidden="true"></div>
              <div class="match-side">
                <div class="match-label">${esc(t("current"))}</div>
                <div class="match-col actual">${right}</div>
              </div>
              <svg class="match-lines" role="img" aria-label="${esc(t("linesAria", { name: block.name }))}"></svg>
            </div>
          </div>
          <p class="grand">${esc(t("leagueTotal", { name: block.name, total: block.total }))}</p>
        </article>`;
    }

    function emptyTable(league) {
      const ids = app.state.using === "confirmed" && app.state.confirmed ? app.state.confirmed[league] : app.state.draft[league];
      const label = t(league);
      const rows = ids.map((id, index) => {
        const team = teamById(id);
        return `<tr><td>${club(team, index + 1, true)}</td><td class="move-line">—</td><td>—</td><td class="penalty">—</td></tr>`;
      }).join("");
      return `
        <article class="card league-${league}">
          <div class="card-head"><h2>${label}</h2></div>
          <div class="table-wrap">
            <table class="compare">
              <thead><tr><th>予想順位</th><th>変動</th><th>現在の順位</th><th>ズレ</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </article>`;
    }

    function homeView() {
      const shown = display();
      const score = shown.score;
      const tables = score
        ? `${tableHtml(score.central, "central")}${tableHtml(score.pacific, "pacific")}<p class="grand">${esc(t("bothTotal", { total: score.total }))}</p>`
        : `${emptyTable("central")}${emptyTable("pacific")}`;
      return `
        <div class="stack">
          ${seasonStatus(shown.progress)}
          ${viewingBanner()}
          ${app.state.viewing_year ? "" : statusBanners()}
          ${hero()}
          ${tables}
          ${resultsCard(shown.progress, shown.recent_games, shown.games_url)}
          ${sourceLine()}
          ${attemptLog()}
        </div>`;
    }

    function trendTable() {
      const signed = (value) => value === 0 ? "0" : `-${value}`;
      const rows = (display().trend || []).map((point) => `<tr><td>${esc(point.date)}</td><td>${signed(point.total)}</td><td>${signed(point.central)}</td><td>${signed(point.pacific)}</td></tr>`).join("");
      if (!rows) return `<p class="empty">${esc(t("emptyTrend"))}</p>`;
      return `<div class="mini-wrap"><table class="mini"><thead><tr><th>${lang === "ja" ? "日付" : "Date"}</th><th>${esc(t("total"))}</th><th>${esc(t("cl"))}</th><th>${esc(t("pl"))}</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    }

    function graphView() {
      const trend = display().trend || [];
      const count = trend.length;
      const finished = display().standings && display().standings.season_finished;
      const span = count
        ? (lang === "ja"
          ? `${shortDate(trend[0].date)}から${shortDate(trend[count - 1].date)}まで`
          : `${shortDate(trend[0].date)}–${shortDate(trend[count - 1].date)}`)
        : "";
      const countNote = count <= 1 ? t("oneDay") : t("manyDays", { span, count });
      const seriesButtons = [
        ["total", t("total"), t("bothFull"), "#1c2430"],
        ["central", t("cl"), t("centralFull"), "#0e7a45"],
        ["pacific", t("pl"), t("pacificFull"), "#1d4e89"]
      ].map(([key, label, full, color]) => `<button type="button" data-action="series" data-series="${key}" class="${app.series[key] ? "on" : "off"}" aria-label="${esc(full)}" title="${esc(full)}"><span class="swatch" style="--c1:${color};--c2:${color}"></span>${esc(label)}</button>`).join("");
      const rankData = display().ranks && display().ranks[app.rankLeague];
      const teamButtons = rankData ? rankData.teams.map((team) => `<button type="button" data-action="solo" data-team="${team.id}" class="${app.solo === team.id ? "on" : ""}">${swatch(team.colors)}${esc(team.name)}</button>`).join("") : "";
      const soloNote = app.solo ? `<span class="key"><span class="dash-sample"></span>${esc(t("dash"))}</span>` : "";
      const end = finished ? t("endFinal") : t("endLatest");
      return `
        <div class="stack">
          <article class="card">
            <div class="card-head"><h2>${esc(t("trendTitle"))}</h2></div>
            <p class="note">${esc(t("trendBody", { end }))}<strong>${esc(t("trendBold"))}</strong>${esc(countNote)}</p>
            <div class="legend one-line">${seriesButtons}</div>
            <div class="chart" id="penalty-chart"></div>
            ${trendTable()}
          </article>
          <article class="card">
            <div class="card-head">
              <h2>${esc(t("rankTitle"))}</h2>
              <div class="segment">
                <button type="button" data-action="rank-league" data-league="central" class="${app.rankLeague === "central" ? "on" : ""}">${esc(t("central"))}</button>
                <button type="button" data-action="rank-league" data-league="pacific" class="${app.rankLeague === "pacific" ? "on" : ""}">${esc(t("pacific"))}</button>
              </div>
            </div>
            <div class="segment" style="margin-top:8px">
              <button type="button" data-action="rank-span" data-span="day" class="${app.rankSpan === "day" ? "on" : ""}">${esc(t("daily"))}</button>
              <button type="button" data-action="rank-span" data-span="month" class="${app.rankSpan === "month" ? "on" : ""}">${esc(t("monthly"))}</button>
            </div>
            <p class="note">${esc(t("rankLead"))}${esc(app.rankSpan === "month" ? t("monthHelp") : t("dayHelp"))}${esc(t("pickTeam"))}</p>
            <div class="legend">${teamButtons}${soloNote}</div>
            <div class="chart" id="rank-chart"></div>
          </article>
        </div>`;
    }

    function seasonCard() {
      const state = app.state;
      const archives = state.archives || [];
      const items = archives.map((item) => {
        const current = state.viewing_year === item.year ? `<span class="tag">${esc(t("showing"))}</span>` : "";
        const label = lang === "ja" ? `${item.year}年の結果` : `${item.year} results`;
        return `<li><span>${esc(label)}${current}</span><button type="button" class="btn" data-action="view-season" data-year="${esc(item.year)}">${esc(t("viewResult"))}</button></li>`;
      }).join("");
      const start = state.can_start_next
        ? `<button type="button" class="btn btn-primary" data-action="start-season">${esc(t("startBtn", { year: state.next_year }))}</button>`
        : "";
      const back = state.viewing_year
        ? `<button type="button" class="btn" data-action="view-season" data-year="">${esc(t("backTo", { year: state.season_year || "" }))}</button>`
        : "";
      let lead = t("leadNone");
      if (state.viewing_year) lead = t("leadView", { view: state.viewing_year, edit: state.season_year || "" });
      else if (state.season_year && !state.standings) lead = t("leadNext", { year: state.season_year });
      else if (state.standings && state.standings.season_finished) lead = t("leadFinished", { year: state.standings.season });
      else if (state.standings && state.standings.season) lead = t("leadCurrent", { year: state.standings.season });
      const note = state.can_start_next
        ? `<p class="note">${esc(t("startNote", { next: state.next_year, year: state.standings.season }))}</p>`
        : "";
      const list = items ? `<ul class="season-list">${items}</ul>` : "";
      return `
        <article class="card">
          <h2>${esc(t("season"))}</h2>
          <p class="score-basis">${esc(lead)}</p>
          ${note}
          <div class="actions" style="margin-top:12px">${start}${back}</div>
          ${list}
        </article>`;
    }

    function settingsView() {
      const locked = app.state.locked;
      const seen = preview();
      const score = app.state.score;
      let previewText = t("previewEmpty");
      if (seen && locked && score) previewText = t("previewLocked", { total: score.total, c: score.central.total, p: score.pacific.total });
      else if (seen && app.state.confirmed && app.state.draft_differs && score) previewText = t("previewEditing", { seen: seen.total, total: score.total });
      else if (seen) previewText = t("previewDraft", { total: seen.total, c: seen.central, p: seen.pacific });
      const confirmLabel = !app.state.confirmed ? t("confirmNew") : (locked ? t("confirmedBtn") : t("confirmUpdate"));
      const extra = app.state.confirmed
        ? (locked
          ? `<button type="button" class="btn" data-action="unlock">${esc(t("unlock"))}</button>`
          : `<button type="button" class="btn" data-action="cancel-edit">${esc(t("cancelEdit"))}</button>`)
        : "";
      const resetDisabled = locked ? "disabled" : "";
      const confirmDisabled = locked ? "disabled" : "";
      return `
        <div class="stack">
          <article class="card">
            <h2>${esc(t("language"))}</h2>
            <div class="segment" style="margin-top:8px">
              <button type="button" data-action="lang" data-lang="ja" class="${lang === "ja" ? "on" : ""}">日本語</button>
              <button type="button" data-action="lang" data-lang="en" class="${lang === "en" ? "on" : ""}">English</button>
            </div>
          </article>
          ${seasonCard()}
          <article class="card">
            <div class="card-head"><h2>${esc(t("predHeading"))}</h2><span class="note">${esc(stampLine())}</span></div>
            <p class="note">${esc(t("dragNote"))}</p>
            <p class="score-basis">${esc(previewText)}</p>
            <div class="actions" style="margin-top:12px">
              <button type="button" class="btn btn-primary" data-action="confirm" ${confirmDisabled}>${esc(confirmLabel)}</button>
              ${extra}
              <button type="button" class="btn" data-action="reset-draft" ${resetDisabled}>${esc(t("reset"))}</button>
            </div>
          </article>
          <div class="boards">
            ${board("central", t("central"))}
            ${board("pacific", t("pacific"))}
          </div>
          <article class="card">
            <h2>${esc(t("history"))}</h2>
            ${historyHtml()}
          </article>
          <article class="card">
            <h2>${esc(t("data"))}</h2>
            <div class="actions" style="margin-top:12px">
              <button type="button" class="btn" data-action="export">${esc(t("exportBtn"))}</button>
              <button type="button" class="btn" data-action="import">${esc(t("importBtn"))}</button>
              <button type="button" class="btn" data-action="delete-data">${esc(t("deleteBtn"))}</button>
            </div>
          </article>
          <article class="card">
            <h2>${esc(t("support"))}</h2>
            <p class="note"><a data-privacy href="${privacyUrl()}" target="_blank" rel="noopener">${esc(t("privacy"))}</a></p>
            <p class="note"><a href="https://forms.gle/3YbhA78mqjRDVS4n6" target="_blank" rel="noopener">${esc(t("contact"))}</a></p>
          </article>
        </div>`;
    }

    function stampLine() {
      if (!app.state.confirmed_label) return t("notConfirmed");
      if (app.state.first_confirmed_label && app.state.first_confirmed_label !== app.state.confirmed_label) {
        return t("firstFinal", { first: app.state.first_confirmed_label, last: app.state.confirmed_label });
      }
      return t("finalOnly", { last: app.state.confirmed_label });
    }

    function board(league, label) {
      const ids = app.state.draft[league];
      const locked = app.state.locked;
      const rows = ids.map((id, index) => {
        const team = teamById(id);
        const drag = locked ? "" : `data-drag="1"`;
        const up = index === 0 || locked ? "disabled" : "";
        const down = index === ids.length - 1 || locked ? "disabled" : "";
        return `
          <div class="team-row" data-league="${league}" data-index="${index}" ${drag}>
            <span class="pos">${index + 1}</span>
            <span class="grip" aria-hidden="true"></span>
            ${swatch(team.colors)}
            <span class="tname" title="${esc(team.full_name)}">${esc(displayName(team))}</span>
            <span style="flex:1"></span>
            <button type="button" class="btn icon-btn" data-action="move" data-league="${league}" data-index="${index}" data-dir="-1" ${up} aria-label="${esc(t("ariaUp", { name: displayName(team) }))}">↑</button>
            <button type="button" class="btn icon-btn" data-action="move" data-league="${league}" data-index="${index}" data-dir="1" ${down} aria-label="${esc(t("ariaDown", { name: displayName(team) }))}">↓</button>
          </div>`;
      }).join("");
      return `<article class="card league-${league}"><h2>${label}</h2>${rows}</article>`;
    }

    function historyHtml() {
      const items = app.state.history || [];
      if (!items.length) return `<p class="empty">${esc(t("historyEmpty"))}</p>`;
      return `<ul class="history">${items.map((item) => `
        <li>
          <time>${esc(item.label)}</time><span class="tag">${esc(actionLabel(item.action))}</span>
          <p class="note">${esc(t("cl"))} ${esc(item.central.map((id) => displayName(teamById(id))).join(" › "))}</p>
          <p class="note">${esc(t("pl"))} ${esc(item.pacific.map((id) => displayName(teamById(id))).join(" › "))}</p>
        </li>`).join("")}</ul>`;
    }

    function render(y) {
      applyChrome();
      document.getElementById("app").innerHTML = `
        <section class="view" data-view="home">${homeView()}</section>
        <section class="view" data-view="graph">${graphView()}</section>
        <section class="view" data-view="settings">${settingsView()}</section>`;
      syncRoute();
      window.scrollTo(0, y || 0);
    }

    function currentRoute() {
      const name = (location.hash || "#home").replace("#", "");
      return ["home", "graph", "settings"].includes(name) ? name : "home";
    }

    function syncRoute() {
      const route = currentRoute();
      document.querySelectorAll(".view").forEach((el) => el.classList.toggle("active", el.dataset.view === route));
      document.querySelectorAll("nav a").forEach((el) => el.classList.toggle("active", el.dataset.route === route));
      if (route === "graph") requestAnimationFrame(() => drawCharts(false));
      if (route === "home") requestAnimationFrame(() => drawMatchLines());
    }

    function drawMatchLines() {
      if (currentRoute() !== "home") return;
      document.querySelectorAll(".match-board").forEach((board) => {
        const svg = board.querySelector(".match-lines");
        const width = board.clientWidth;
        const height = board.clientHeight;
        if (!svg || !width || !height) return;
        const box = board.getBoundingClientRect();
        const right = {};
        board.querySelectorAll(".match-col.actual .match-row").forEach((row) => {
          right[row.dataset.team] = row;
        });
        const parts = [];
        board.querySelectorAll(".match-col.pred .match-row").forEach((row) => {
          const other = right[row.dataset.team];
          if (!other) return;
          const from = row.getBoundingClientRect();
          const to = other.getBoundingClientRect();
          const x1 = from.right - box.left;
          const y1 = from.top + from.height / 2 - box.top;
          const x2 = to.left - box.left;
          const y2 = to.top + to.height / 2 - box.top;
          const color = row.dataset.stroke || "#1e3a5f";
          const bend = Math.max(24, (x2 - x1) * 0.45);
          const endX = x2 - 7;
          const d = `M ${x1.toFixed(1)} ${y1.toFixed(1)} C ${(x1 + bend).toFixed(1)} ${y1.toFixed(1)}, ${(x2 - bend).toFixed(1)} ${y2.toFixed(1)}, ${endX.toFixed(1)} ${y2.toFixed(1)}`;
          if (isLightColor(color)) parts.push(`<path d="${d}" fill="none" stroke="#1a1a1a" stroke-width="3.4" stroke-linecap="round"></path>`);
          parts.push(`<path d="${d}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="round"></path>`);
          const tip = `${x2.toFixed(1)},${y2.toFixed(1)} ${(x2 - 7).toFixed(1)},${(y2 - 3.5).toFixed(1)} ${(x2 - 7).toFixed(1)},${(y2 + 3.5).toFixed(1)}`;
          parts.push(`<polygon points="${tip}" fill="${color}"${isLightColor(color) ? ` stroke="#1a1a1a" stroke-width="1"` : ""}></polygon>`);
        });
        svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
        svg.innerHTML = parts.join("");
      });
    }

    function isLightColor(color) {
      const hex = String(color || "").replace("#", "");
      if (hex.length !== 6) return false;
      const value = parseInt(hex, 16);
      const r = (value >> 16) & 255;
      const g = (value >> 8) & 255;
      const b = value & 255;
      return (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255 > 0.72;
    }

    function monthIndexes(dates) {
      const indexes = [];
      dates.forEach((iso, index) => {
        const month = String(iso).slice(0, 7);
        if (!indexes.length || String(dates[indexes[indexes.length - 1]]).slice(0, 7) !== month) indexes.push(index);
        else indexes[indexes.length - 1] = index;
      });
      return indexes;
    }

    function labelIndexes(count) {
      if (count <= 8) return [...Array(count).keys()];
      const step = Math.ceil(count / 6);
      const indexes = [];
      for (let i = 0; i < count; i += step) indexes.push(i);
      if (indexes[indexes.length - 1] !== count - 1) indexes.push(count - 1);
      return indexes;
    }

    function drawLineChart(el, options) {
      if (!options.dates.length) {
        el.innerHTML = `<p class="empty">${esc(options.empty)}</p>`;
        return;
      }
      const width = el.clientWidth;
      const height = 300;
      const pad = { l: options.tickUnit ? 68 : 48, r: 16, t: 16, b: 36 };
      const innerW = width - pad.l - pad.r;
      const innerH = height - pad.t - pad.b;
      const x = (index) => options.dates.length === 1 ? pad.l + innerW / 2 : pad.l + (index / (options.dates.length - 1)) * innerW;
      const y = (value) => {
        const ratio = (value - options.yMin) / ((options.yMax - options.yMin) || 1);
        return pad.t + (options.reverse ? ratio : 1 - ratio) * innerH;
      };
      const grid = options.ticks.map((tick) => {
        const yy = y(tick);
        const label = options.formatTick ? options.formatTick(tick) : String(tick);
        const unit = options.tickUnit ? `<tspan class="tick-unit">${esc(options.tickUnit)}</tspan>` : "";
        return `<line class="grid" x1="${pad.l}" y1="${yy}" x2="${width - pad.r}" y2="${yy}"></line><text x="${pad.l - 8}" y="${yy + 4}" text-anchor="end">${esc(label)}${unit}</text>`;
      }).join("");
      const labels = labelIndexes(options.dates.length).map((index) => {
        const count = options.dates.length;
        const anchor = count > 1 && index === 0 ? "start" : count > 1 && index === count - 1 ? "end" : "middle";
        return `<text x="${x(index)}" y="${height - 12}" text-anchor="${anchor}">${esc(shortDate(options.dates[index]))}</text>`;
      }).join("");
      const paths = options.series.filter((series) => !series.hidden).map((series) => {
        const points = series.values.map((value, index) => `${x(index)},${y(value)}`).join(" ");
        const circles = series.dash || options.dates.length > 20 ? "" : series.values.map((value, index) => `<circle cx="${x(index)}" cy="${y(value)}" r="${options.dates.length === 1 ? 5 : 3.5}" fill="${series.color}"></circle>`).join("");
        const dash = series.dash ? ` stroke-dasharray="5 4"` : "";
        const edge = !series.dash && isLightColor(series.color) ? `<polyline points="${points}" fill="none" stroke="#1a1a1a" stroke-width="3.6"></polyline>` : "";
        return `${edge}<polyline points="${points}" fill="none" stroke="${series.color}" stroke-width="${series.dash ? 1.6 : 2.2}"${dash}></polyline>${circles}`;
      }).join("");
      el.innerHTML = `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${esc(options.label)}">${grid}${paths}${labels}</svg>`;
    }

    function drawCharts(retried) {
      if (currentRoute() !== "graph") return;
      const penalty = document.getElementById("penalty-chart");
      const rank = document.getElementById("rank-chart");
      if (!penalty || penalty.clientWidth === 0) {
        if (!retried) requestAnimationFrame(() => drawCharts(true));
        return;
      }
      const trend = display().trend || [];
      const visible = [
        { key: "total", color: "#1c2430", values: trend.map((point) => -point.total) },
        { key: "central", color: "#0e7a45", values: trend.map((point) => -point.central) },
        { key: "pacific", color: "#1d4e89", values: trend.map((point) => -point.pacific) }
      ].filter((series) => app.series[series.key]);
      const magnitude = Math.max(0, ...visible.flatMap((series) => series.values.map((value) => -value)));
      const step = magnitude <= 8 ? 2 : magnitude <= 20 ? 4 : 8;
      const yMin = -Math.max(step, Math.ceil(Math.max(magnitude, 1) / step) * step);
      const ticks = [];
      for (let value = 0; value >= yMin; value -= step) ticks.push(value);
      drawLineChart(penalty, {
        dates: trend.map((point) => point.date),
        series: visible,
        yMin,
        yMax: 0,
        reverse: false,
        ticks,
        tickUnit: t("miss"),
        label: t("chartPenalty"),
        empty: t("emptyTrendChart")
      });
      const data = display().ranks && display().ranks[app.rankLeague];
      let dates = data ? data.dates : [];
      let teams = data ? data.teams : [];
      if (app.solo) teams = teams.filter((team) => team.id === app.solo);
      let series = teams.map((team) => ({ color: strokeFor(team), values: team.ranks, dash: false, hidden: false }));
      if (app.solo && teams[0]) {
        series.push({ color: strokeFor(teams[0]), values: dates.map(() => teams[0].predicted_rank), dash: true, hidden: false });
      }
      if (app.rankSpan === "month") {
        const indexes = monthIndexes(dates);
        dates = indexes.map((index) => dates[index]);
        series = series.map((item) => ({ ...item, values: indexes.map((index) => item.values[index]) }));
      }
      drawLineChart(rank, {
        dates,
        series,
        yMin: 1,
        yMax: 6,
        reverse: true,
        ticks: [1, 2, 3, 4, 5, 6],
        formatTick: (value) => lang === "ja" ? `${value}位` : String(value),
        label: t("chartRank"),
        empty: t("emptyRank")
      });
    }

    function reorder(draft, league, from, to) {
      if (from === to || to < 0 || to >= draft[league].length) return null;
      const order = draft[league].slice();
      const [item] = order.splice(from, 1);
      order.splice(to, 0, item);
      return {
        central: league === "central" ? order : draft.central.slice(),
        pacific: league === "pacific" ? order : draft.pacific.slice()
      };
    }

    function commitLineup(next) {
      if (!next || !app.user || app.user.locked) return;
      app.user.draft = next;
      saveUser(app.user);
      paint();
    }

    function confirmOrder() {
      const user = app.user;
      if (!user || user.locked) return;
      const lineup = { central: user.draft.central.slice(), pacific: user.draft.pacific.slice() };
      if (user.confirmed && sameOrder(user.confirmed, lineup)) {
        user.locked = true;
        saveUser(user);
        paint("sameOrder");
        return;
      }
      const label = nowLabel();
      const action = user.confirmed ? "update" : "confirm";
      user.confirmed = {
        central: lineup.central.slice(),
        pacific: lineup.pacific.slice(),
        confirmed_at: user.confirmed ? user.confirmed.confirmed_at : label,
        confirmed_label: user.confirmed ? user.confirmed.confirmed_label : label,
        updated_at: label,
        updated_label: label
      };
      user.locked = true;
      user.history.push({ label, action, central: lineup.central.slice(), pacific: lineup.pacific.slice() });
      saveUser(user);
      paint(action === "update" ? "didUpdate" : "didConfirm", { label });
    }

    function unlockOrder() {
      if (!app.user || !app.user.confirmed) {
        paint("noConfirm");
        return;
      }
      app.user.locked = false;
      saveUser(app.user);
      paint("unlocked");
    }

    function cancelEdit() {
      const user = app.user;
      if (!user || !user.confirmed) {
        paint("noConfirm");
        return;
      }
      user.draft = { central: user.confirmed.central.slice(), pacific: user.confirmed.pacific.slice() };
      user.locked = true;
      saveUser(user);
      paint("canceled");
    }

    function resetDraft() {
      if (!app.user || app.user.locked) return;
      app.user.draft = defaultUser().draft;
      saveUser(app.user);
      paint("resetDone");
    }

    function startSeason() {
      const standings = app.public && app.public.standings;
      if (!app.state.can_start_next || !standings) {
        paint("startTooEarly");
        return;
      }
      const year = Number(standings.season);
      const user = app.user;
      const archive = {
        year,
        archived_label: nowLabel(),
        prediction: activePrediction(user),
        standings: {
          central: standings.central.slice(),
          pacific: standings.pacific.slice(),
          season: standings.season,
          season_finished: true,
          source_label: standings.source_label,
          source_url: standings.source_url,
          fetched_label: standings.fetched_label
        },
        snapshots: (app.public.snapshots || []).map((snap) => ({ date: snap.date, central: snap.central, pacific: snap.pacific })),
        progress: app.public.progress,
        recent_games: app.public.recent_games || [],
        games_url: app.public.games_url
      };
      user.archives = (user.archives || []).filter((item) => item.year !== year);
      user.archives.push(archive);
      user.season_year = year + 1;
      user.view_year = null;
      user.draft = defaultUser().draft;
      user.confirmed = null;
      user.locked = false;
      user.history = [];
      saveUser(user);
      paint("started", { year: year + 1, prev: year });
    }

    function viewSeason(year) {
      const user = app.user;
      if (!year) {
        user.view_year = null;
        saveUser(user);
        paint("backNotice");
        return;
      }
      const found = Number(year);
      if (!user.archives.some((item) => item.year === found)) return;
      user.view_year = found;
      saveUser(user);
      paint("viewingNotice", { year: found });
    }

    function deleteLocalData() {
      saveUser(defaultUser());
      paint("deleted");
    }

    function onClick(event) {
      const button = event.target.closest("[data-action]");
      if (!button || button.disabled) return;
      const action = button.dataset.action;
      if (action === "refresh") {
        button.disabled = true;
        enqueue(async () => {
          const data = await postJson("/api/refresh");
          if (data && data.teams) applyState(data);
        });
      } else if (action === "share") {
        shareBoard();
      } else if (action === "copy") {
        copyText();
      } else if (action === "confirm") {
        confirmOrder();
      } else if (action === "unlock") {
        unlockOrder();
      } else if (action === "cancel-edit") {
        cancelEdit();
      } else if (action === "reset-draft") {
        resetDraft();
      } else if (action === "move") {
        commitLineup(reorder(app.state.draft, button.dataset.league, Number(button.dataset.index), Number(button.dataset.index) + Number(button.dataset.dir)));
      } else if (action === "rank-league") {
        app.rankLeague = button.dataset.league;
        app.solo = null;
        render(window.scrollY);
      } else if (action === "rank-span") {
        app.rankSpan = button.dataset.span === "month" ? "month" : "day";
        render(window.scrollY);
      } else if (action === "solo") {
        app.solo = app.solo === button.dataset.team ? null : button.dataset.team;
        render(window.scrollY);
      } else if (action === "start-season") {
        const year = app.state.next_year;
        const prev = (app.state.standings && app.state.standings.season) || (year - 1);
        if (!window.confirm(t("startAsk", { year, prev }))) return;
        startSeason();
      } else if (action === "view-season") {
        viewSeason(button.dataset.year);
      } else if (action === "lang") {
        setLang(button.dataset.lang);
      } else if (action === "export") {
        exportData();
      } else if (action === "import") {
        document.getElementById("import-file").click();
      } else if (action === "delete-data") {
        if (!window.confirm(t("deleteAsk"))) return;
        deleteLocalData();
      } else if (action === "series") {
        const key = button.dataset.series;
        app.series[key] = !app.series[key];
        if (!app.series.total && !app.series.central && !app.series.pacific) app.series[key] = true;
        render(window.scrollY);
      }
    }

    function drawShareSwatch(ctx, x, y, colors) {
      ctx.save();
      ctx.fillStyle = colors[0];
      ctx.fillRect(x, y, 14, 16);
      ctx.fillStyle = colors[1] || colors[0];
      ctx.fillRect(x + 14, y, 14, 16);
      ctx.strokeStyle = "rgba(0,0,0,0.18)";
      ctx.strokeRect(x + 0.5, y + 0.5, 27, 15);
      ctx.restore();
    }

    function renderShareCanvas() {
      const score = display().score;
      const width = 720;
      const rowH = 52;
      const leagueH = 52 + rowH * 6 + 18;
      const height = 24 + 150 + 16 + leagueH + 16 + leagueH + 28;
      const canvas = document.createElement("canvas");
      const scale = 2;
      canvas.width = width * scale;
      canvas.height = height * scale;
      const ctx = canvas.getContext("2d");
      ctx.scale(scale, scale);
      const font = "'Segoe UI', 'Yu Gothic UI', 'Yu Gothic', 'Hiragino Sans', Meiryo, sans-serif";
      ctx.fillStyle = "#f4f6f8";
      ctx.fillRect(0, 0, width, height);
      ctx.fillStyle = "#1b2430";
      ctx.font = `700 22px ${font}`;
      ctx.fillText(t("appTitle"), 28, 46);
      ctx.fillStyle = "#ffffff";
      ctx.strokeStyle = "#e3e7ee";
      ctx.beginPath();
      ctx.roundRect(28, 64, width - 56, 96, 12);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#5e6a7a";
      ctx.font = `700 13px ${font}`;
      ctx.fillText(t("both"), 48, 90);
      ctx.fillStyle = "#1b2430";
      ctx.font = `700 40px ${font}`;
      ctx.fillText(String(score.total), 48, 136);
      const totalW = ctx.measureText(String(score.total)).width;
      ctx.font = `700 16px ${font}`;
      if (lang === "ja") ctx.fillText(t("miss"), 54 + totalW, 136);
      ctx.font = `700 16px ${font}`;
      ctx.fillStyle = "#5e6a7a";
      ctx.fillText(t("cl"), 250, 108);
      ctx.fillText(t("pl"), 360, 108);
      ctx.fillStyle = "#1b2430";
      ctx.font = `700 24px ${font}`;
      ctx.fillText(missLabel(score.central.total), 250, 138);
      ctx.fillText(missLabel(score.pacific.total), 360, 138);

      const drawLeague = (block, top, accent) => {
        const x = 28;
        const w = width - 56;
        ctx.fillStyle = "#ffffff";
        ctx.strokeStyle = "#e3e7ee";
        ctx.beginPath();
        ctx.roundRect(x, top, w, leagueH, 12);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = accent;
        ctx.fillRect(x, top, w, 4);
        ctx.fillStyle = "#1b2430";
        ctx.font = `700 18px ${font}`;
        ctx.fillText(block.name, x + 20, top + 32);
        ctx.font = `650 16px ${font}`;
        const nameW = Math.max(...block.rows.map((row) => ctx.measureText(row.name).width));
        ctx.font = `700 16px ${font}`;
        const penW = Math.max(...block.rows.map((row) => ctx.measureText(missLabel(row.penalty)).width));
        const rightW = 22 + 8 + 28 + 8 + nameW + 22 + penW;
        const rightX = x + w - 20 - rightW;
        const leftX = x + 20;
        const actualY = {};
        block.rows.forEach((row) => {
          actualY[row.team] = top + 48 + (row.actual_rank - 1) * rowH + rowH / 2;
        });
        block.rows.forEach((row) => {
          const y1 = top + 48 + (row.predicted_rank - 1) * rowH + rowH / 2;
          const y2 = actualY[row.team];
          const x1 = leftX + 22 + 8 + 28;
          const x2 = rightX - 8;
          const color = strokeFor(row);
          const bend = Math.max(28, (x2 - x1) * 0.45);
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.bezierCurveTo(x1 + bend, y1, x2 - bend, y2, x2, y2);
          if (isLightColor(color)) {
            ctx.strokeStyle = "#1a1a1a";
            ctx.lineWidth = 4;
            ctx.stroke();
          }
          ctx.strokeStyle = color;
          ctx.lineWidth = 2.4;
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(x2 + 7, y2);
          ctx.lineTo(x2, y2 - 4);
          ctx.lineTo(x2, y2 + 4);
          ctx.closePath();
          ctx.fillStyle = color;
          ctx.fill();
        });
        block.rows.forEach((row) => {
          const y = top + 48 + (row.predicted_rank - 1) * rowH;
          const cy = y + rowH / 2;
          ctx.fillStyle = "#5e6a7a";
          ctx.font = `700 16px ${font}`;
          ctx.textAlign = "left";
          ctx.fillText(String(row.predicted_rank), leftX, cy + 6);
          drawShareSwatch(ctx, leftX + 22, cy - 8, row.colors);
        });
        const actual = block.rows.slice().sort((a, b) => a.actual_rank - b.actual_rank);
        actual.forEach((row) => {
          const y = top + 48 + (row.actual_rank - 1) * rowH;
          const cy = y + rowH / 2;
          ctx.fillStyle = "#5e6a7a";
          ctx.font = `700 16px ${font}`;
          ctx.textAlign = "left";
          ctx.fillText(String(row.actual_rank), rightX, cy + 6);
          drawShareSwatch(ctx, rightX + 22, cy - 8, row.colors);
          ctx.fillStyle = "#1b2430";
          ctx.font = `650 16px ${font}`;
          ctx.textAlign = "left";
          ctx.fillText(row.name, rightX + 22 + 8 + 28 + 8, cy + 6);
          ctx.fillStyle = row.penalty === 0 ? "#0e7a45" : "#9a3412";
          ctx.font = `700 16px ${font}`;
          ctx.fillText(missLabel(row.penalty), x + w - 20, cy + 6);
          ctx.textAlign = "left";
        });
        ctx.fillStyle = "#1b2430";
        ctx.font = `700 14px ${font}`;
        ctx.textAlign = "right";
        ctx.fillText(t("leagueTotal", { name: block.name, total: block.total }), x + w - 20, top + leagueH - 12);
        ctx.textAlign = "left";
      };
      drawLeague(score.central, 180, "#0e7a45");
      drawLeague(score.pacific, 180 + leagueH + 16, "#1d4e89");
      return canvas;
    }

    async function shareBoard() {
      const score = display().score;
      if (!score) return;
      const canvas = renderShareCanvas();
      const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
      if (!blob) {
        toast(t("imageFail"));
        return;
      }
      const file = new File([blob], "pennant-penalty.png", { type: "image/png" });
      const text = t("shareHead", { mark: "", total: score.total, c: score.central.total, p: score.pacific.total });
      try {
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: t("appTitle"), text });
          return;
        }
      } catch (err) {
        if (err && err.name === "AbortError") return;
      }
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "pennant-penalty.png";
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      toast(t("imageSaved"));
    }

    async function copyText() {
      const text = shareText(true);
      try {
        await navigator.clipboard.writeText(text);
      } catch (err) {
        const area = document.createElement("textarea");
        area.value = text;
        document.body.appendChild(area);
        area.select();
        document.execCommand("copy");
        area.remove();
      }
      toast(t("copyDone"));
    }

    function onPointerDown(event) {
      if (event.pointerType === "mouse" && event.button !== 0) return;
      const row = event.target.closest(".team-row[data-drag]");
      if (!row || event.target.closest("button")) return;
      if (event.pointerType === "touch" && !event.target.closest(".grip")) return;
      drag = {
        pointerId: event.pointerId,
        league: row.dataset.league,
        index: Number(row.dataset.index),
        startY: event.clientY,
        active: false,
        row
      };
      row.setPointerCapture(event.pointerId);
    }

    function onPointerMove(event) {
      if (!drag || event.pointerId !== drag.pointerId) return;
      if (!drag.active && Math.abs(event.clientY - drag.startY) < 6) return;
      drag.active = true;
      drag.row.classList.add("dragging");
      drag.row.style.pointerEvents = "none";
      const hit = document.elementFromPoint(event.clientX, event.clientY);
      drag.row.style.pointerEvents = "";
      const over = hit && hit.closest(".team-row[data-drag]");
      document.querySelectorAll(".team-row.over").forEach((el) => el.classList.remove("over"));
      if (over && over.dataset.league === drag.league) {
        drag.over = over;
        over.classList.add("over");
      } else {
        drag.over = null;
      }
    }

    function onPointerUp(event) {
      if (!drag || event.pointerId !== drag.pointerId) return;
      const from = drag.index;
      const over = drag.over;
      const league = drag.league;
      const moved = drag.active;
      drag.row.classList.remove("dragging");
      drag.row.style.pointerEvents = "";
      document.querySelectorAll(".team-row.over").forEach((el) => el.classList.remove("over"));
      drag = null;
      if (moved && over && over.dataset.league === league) {
        commitLineup(reorder(app.state.draft, league, from, Number(over.dataset.index)));
      }
    }

    async function exportData() {
      const user = app.user || defaultUser();
      const data = {
        format: "pennant-penalty",
        version: 1,
        exported_label: nowLabel(),
        draft: user.draft,
        confirmed: user.confirmed,
        locked: user.locked,
        history: user.history,
        archives: user.archives,
        season_year: user.season_year,
        view_year: user.view_year
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "pennant-penalty-backup.json";
      link.click();
      setTimeout(() => URL.revokeObjectURL(link.href), 1000);
      toast(t("exported"));
    }

    async function importFile(file) {
      let data;
      try {
        data = JSON.parse(await file.text());
      } catch (err) {
        toast(t("jsonBad"));
        return;
      }
      if (!data || data.format !== "pennant-penalty") {
        toast(t("importBad"));
        return;
      }
      if (!window.confirm(t("importAsk"))) return;
      saveUser(repairUser(data));
      paint("imported");
    }

    function bind() {
      document.getElementById("import-file").addEventListener("change", (event) => {
        const file = event.target.files && event.target.files[0];
        event.target.value = "";
        if (file) importFile(file);
      });
      document.body.addEventListener("click", onClick);
      document.body.addEventListener("pointerdown", onPointerDown);
      document.body.addEventListener("pointermove", onPointerMove);
      document.body.addEventListener("pointerup", onPointerUp);
      document.body.addEventListener("pointercancel", onPointerUp);
      window.addEventListener("hashchange", () => syncRoute());
      window.addEventListener("resize", () => {
        if (currentRoute() === "graph") drawCharts(false);
        if (currentRoute() === "home") drawMatchLines();
      });
    }

    async function finishMigration() {
      await fetch("/api/data/delete", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
      if (app.public && app.public.standings) return;
      const fresh = await postJson("/api/refresh");
      if (fresh && fresh.teams) {
        app.public = fresh;
        app.user = loadUser() || defaultUser();
        app.state = compose();
        render(window.scrollY);
      }
    }

    async function boot() {
      bind();
      applyChrome();
      mountAd();
      if (!location.hash) history.replaceState(null, "", "#home");
      try {
        const res = await fetch("/api/dashboard");
        const data = await res.json();
        const viewingSaved = (() => {
          try {
            const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
            return Boolean(saved && saved.view_year);
          } catch (err) {
            return false;
          }
        })();
        let payload = data;
        if ((!data.standings || data.stale) && !viewingSaved) {
          document.getElementById("app").innerHTML = `<p class="loading">${esc(t("fetching"))}</p>`;
          const fresh = await postJson("/api/refresh");
          if (fresh && fresh.teams) payload = fresh;
        }
        const shouldMove = !localStorage.getItem(STORAGE_KEY) && Boolean(payload.legacy_user);
        applyState(payload);
        if (shouldMove) await finishMigration();
      } catch (err) {
        document.getElementById("app").innerHTML = `<p class="banner warn">${esc(t("offline"))}</p>`;
      }
    }

    boot();
  </script>
</body>
</html>
